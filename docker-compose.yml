
services:
  backend:
    build:
      context: ./backend
    container_name: workforce_backend
    ports:
      - "8003:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      APP_NAME: "WorkForce AI Pro"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: workforce_db
      DB_USER: workforce_user
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      PASSWORD_RESET_DEBUG: ${PASSWORD_RESET_DEBUG:-false}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: workforce_mysql
    environment:
      MYSQL_DATABASE: workforce_db
      MYSQL_USER: workforce_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "3308:3306"
    volumes:
      - workforce_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: workforce_frontend
    ports:
      - "5175:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  workforce_mysql_data:
